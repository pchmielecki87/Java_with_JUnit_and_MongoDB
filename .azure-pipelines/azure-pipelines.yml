trigger:
- main

variables:
  - group: "KV variable group"
  - group: "Local secrets group"
  - name: java.version
    value: '1.11'
  - name: maven.pom.file
    value: 'pom.xml'
  - name: system.debug
    value: 'false'

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    sudo apt-get update
    sudo apt-get install -y openjdk-11-jdk
    java -version
  displayName: 'Install Java 11'
  
- script: |
    echo "Pipeline Variables:"
    echo "Java Version: $(java.version)"
    echo "Maven POM File: $(maven.pom.file)"
    echo "System Debug: $(system.debug)"
    echo "Secret from KV: $(secret1)"
    echo "Secret from Local: $(test1)"
  displayName: 'Print Pipeline Variables and Secrets'

- task: Maven@4
  displayName: Maven Clean Package
  inputs:
    mavenPomFile: '$(system.defaultWorkingDirectory)/pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: 'default'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    goals: 'clean package'

- task: PublishTestResults@2
  displayName: Publish Test Results
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
    failTaskOnFailedTests: true

- task: CopyFiles@2
  displayName: Copy Artifacts
  inputs:
    SourceFolder: '$(system.defaultWorkingDirectory)/target/'
    Contents: '**/?(*.jar)'
    TargetFolder: '$(build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  displayName: Publish Build Artifacts
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'java-calc-jar'
    publishLocation: 'Container'

- task: Maven@4
  displayName: 'Publish to ADO techbrain-feed'
  inputs:
    mavenPomFile: '$(system.defaultWorkingDirectory)/pom.xml'
    goals: 'deploy'
    options: '-DskipTests'
    publishJUnitResults: false
    mavenOptions: '-Xmx1024m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'
    mavenAuthenticateFeed: true
    effectivePomSkip: false
    sonarQubeRunAnalysis: false
